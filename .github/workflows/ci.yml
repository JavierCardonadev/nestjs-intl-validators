name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build

  nest11:
    name: NestJS 11 + class-validator 0.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save @nestjs/common@^11 @nestjs/core@^11 @nestjs/platform-express@^11 @nestjs/testing@^11 class-validator@^0.14
      - run: npx vitest run test/nest.spec.ts test/class-validator.spec.ts

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Core entry works without optional peers
        run: |
          mkdir /tmp/core && cd /tmp/core
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/nestjs-intl-validators-*.tgz
          node --input-type=module -e "import { validateDocument } from 'nestjs-intl-validators/core'; if (!validateDocument('52998224725', { country: 'BR' }).valid) process.exit(1); console.log('core ok')"
      - name: Full entry works from ESM and CommonJS
        run: |
          mkdir /tmp/full && cd /tmp/full
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/nestjs-intl-validators-*.tgz @nestjs/common class-validator class-transformer reflect-metadata rxjs
          node --input-type=module -e "import 'reflect-metadata'; const m = await import('nestjs-intl-validators'); if (!m.IsDocument || !m.ParsePhonePipe) process.exit(1); console.log(Object.keys(m).length, 'exports')"
          node -e "require('reflect-metadata'); const m = require('nestjs-intl-validators'); if (!m.IsCpf) process.exit(1); console.log('require(esm) ok')"
